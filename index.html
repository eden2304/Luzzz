<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/favicon-512.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ff8fb8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="לוזזזייי — לוח הזמנים האישי שלך, ורוד ופשוט" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="לוזזזייי" />
    <title>לוזזזייי</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand">
          <img class="brand-logo-img" src="/images/LuzLogo.png" alt="לוזזזייי" />
          <h1 class="brand-title">לוזזזייי</h1>
        </div>
        <div class="header-actions">
          <button id="search-btn" class="icon-btn" aria-label="חיפוש אירועים" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>
      </header>

      <div class="month-nav">
        <button id="prev-month" class="nav-arrow" aria-label="חודש קודם" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button id="month-label" class="month-label" type="button" aria-live="polite"></button>
        <button id="next-month" class="nav-arrow" aria-label="חודש הבא" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>

      <div class="today-row">
        <button id="today-btn" class="pill-btn" type="button">היום</button>
      </div>

      <button id="sync-banner" class="sync-banner hidden" type="button"></button>

      <button id="notif-banner" class="notif-banner hidden" type="button">
        <span class="notif-banner-icon">🔔</span>
        <span>הפעילו התראות כדי לקבל תזכורת יום לפני כל אירוע</span>
      </button>

      <main class="main-layout">
        <section class="calendar-panel">
          <div class="weekday-row" id="weekday-row"></div>
          <div class="calendar-grid" id="calendar-grid"></div>
        </section>

        <aside class="agenda-panel" id="agenda-panel">
          <h2 class="agenda-title">האירועים הקרובים</h2>
          <div class="agenda-list" id="agenda-list"></div>
        </aside>
      </main>

      <button id="fab-add" class="fab" aria-label="הוספת אירוע" type="button">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <!-- Day detail modal -->
    <div id="day-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-sheet day-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h2 id="day-modal-title" class="sheet-title"></h2>
          <button class="icon-btn close-btn" data-close="day-modal" aria-label="סגירה" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
          </button>
        </div>
        <div id="day-events-list" class="day-events-list"></div>
        <button id="day-add-event" class="primary-btn full-width" type="button">+ הוספת אירוע ליום זה</button>
      </div>
    </div>

    <!-- Add/Edit event modal -->
    <div id="event-form-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-sheet form-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h2 id="event-form-title" class="sheet-title">אירוע חדש</h2>
          <button class="icon-btn close-btn" data-close="event-form-modal" aria-label="סגירה" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
          </button>
        </div>
        <form id="event-form" class="event-form">
          <label class="field">
            <span class="field-label">שם האירוע</span>
            <input id="ev-title" name="title" type="text" placeholder="לדוגמה: דייט עם עדן" required maxlength="80" />
          </label>

          <div id="mode-toggle" class="mode-toggle">
            <button type="button" class="mode-btn active" data-mode="single">יום בודד</button>
            <button type="button" class="mode-btn" data-mode="multi">מספר תאריכים</button>
          </div>

          <div id="single-date-field" class="field">
            <span class="field-label">תאריך</span>
            <div id="date-picker" class="chip-scroller-wrap"></div>
            <span id="date-readable" class="picker-readable"></span>
          </div>

          <div id="multi-date-field" class="field hidden">
            <span class="field-label">בחרו תאריכים ללוז</span>
            <div id="mini-calendar" class="mini-calendar"></div>
            <span id="multi-date-count" class="picker-readable">לא נבחרו תאריכים</span>
          </div>

          <div class="field-row">
            <div class="field">
              <span class="field-label">שעת התחלה</span>
              <div id="start-time-picker" class="chip-scroller-wrap time-scroller"></div>
            </div>
            <div class="field">
              <span class="field-label">שעת סיום</span>
              <div id="end-time-picker" class="chip-scroller-wrap time-scroller"></div>
            </div>
          </div>

          <label class="field">
            <span class="field-label">הערה (אופציונלי)</span>
            <input id="ev-note" name="note" type="text" placeholder="מיקום, פרטים נוספים..." maxlength="140" />
          </label>

          <div class="field">
            <span class="field-label">צבע</span>
            <div id="color-picker" class="color-picker"></div>
          </div>

          <label class="reminder-field">
            <input type="checkbox" id="ev-remind" class="reminder-checkbox" />
            <span class="reminder-toggle">
              <span class="reminder-icon">🔔</span>
              <span>תזכורת יום לפני</span>
            </span>
          </label>

          <p id="form-error" class="form-error hidden"></p>

          <div class="form-actions">
            <button id="delete-event-btn" class="danger-btn hidden" type="button">מחיקה</button>
            <button class="primary-btn" type="submit">שמירה</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Search overlay -->
    <div id="search-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-sheet search-sheet">
        <div class="sheet-header">
          <div class="search-input-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="search-input" type="text" placeholder="חיפוש אירועים..." autocomplete="off" />
          </div>
          <button class="icon-btn close-btn" data-close="search-modal" aria-label="סגירה" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
          </button>
        </div>
        <div id="search-results" class="day-events-list"></div>
      </div>
    </div>

    <!-- Short event details popup -->
    <div id="event-details-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-sheet details-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h2 id="details-title" class="sheet-title"></h2>
          <button class="icon-btn close-btn" data-close="event-details-modal" aria-label="סגירה" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
          </button>
        </div>
        <div class="details-row">
          <span id="details-color" class="details-color-dot"></span>
          <span id="details-time"></span>
        </div>
        <div id="details-date" class="details-date"></div>
        <p id="details-note" class="details-note hidden"></p>
      </div>
    </div>

    <!-- Styled confirmation popup (replaces native confirm()) -->
    <div id="confirm-modal" class="modal-overlay hidden" role="alertdialog" aria-modal="true">
      <div class="modal-sheet confirm-sheet">
        <div class="sheet-handle"></div>
        <span class="confirm-icon">🗑️</span>
        <p id="confirm-message" class="confirm-message"></p>
        <div class="confirm-actions">
          <button id="confirm-cancel-btn" class="pill-btn confirm-btn" type="button">ביטול</button>
          <button id="confirm-ok-btn" class="danger-btn confirm-btn" type="button">מחיקה</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
